name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Build, lint, and unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .tool-versions
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Run ESLint
        run: npm run lint -- --no-fix

      - name: Run SunLint
        run: npm run lint:sun

      - name: Run unit tests
        run: npm test -- --runInBand

  e2e:
    name: End-to-end tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: booking_tour_ci_test
          POSTGRES_USER: nestjs
          POSTGRES_PASSWORD: nestjs
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nestjs -d booking_tour_ci_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      JWT_SECRET: test-only-jwt-secret-0123456789012345
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_USERNAME: nestjs
      DB_PASSWORD: nestjs
      DB_NAME: booking_tour
      DB_TEST_NAME: booking_tour_ci_test
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379
      REDIS_PASSWORD: ''
      MAIL_ENABLED: 'false'
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .tool-versions
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply database migrations
        run: npm run db:migration:run:test

      - name: Run end-to-end tests
        run: npm run test:e2e -- --runInBand
