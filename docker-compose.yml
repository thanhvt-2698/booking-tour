services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: booking_tour
      POSTGRES_PASSWORD: nestjs
      POSTGRES_USER: nestjs
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U nestjs -d booking_tour']
      interval: 5s
      timeout: 5s
      retries: 5
    ports:
      - '5433:5432'
    volumes:
      - booking_tour_postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/01-create-test-database.sql:ro

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5
    ports:
      - '6380:6379'
    volumes:
      - booking_tour_redis_data:/data

volumes:
  booking_tour_postgres_data:
  booking_tour_redis_data:
